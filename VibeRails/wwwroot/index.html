<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Rails</title>
    <link rel="icon" type="image/x-icon" href="assets/img/logo.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&family=Major+Mono+Display&display=swap">
    <link rel="stylesheet" href="assets/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/xterm/xterm.css" />
    <link rel="stylesheet" href="assets/fontawesome/all.min.css" />
    <link rel="stylesheet" href="assets/not-a-toast.css" />
    <link rel="stylesheet" href="assets/tom-select/tom-select.bootstrap5.min.css" />
    <style>
        /* Hide nav until app stylesheet loads to prevent FOUC */
        .app-subnav { opacity: 0; }
    </style>
    <script>
        window.__viberails_cache_bust__ = Date.now().toString(36);

        if (window.location.pathname.replace(/\/+$/, '') === '/git-guard') {
            document.documentElement.classList.add('git-guard-focus-active');
        }

        const _assetBase = (window.__viberails_VSCODE__ && window.__viberails_ASSETS_BASE__)
            ? window.__viberails_ASSETS_BASE__.replace(/\/$/, '') + '/'
            : document.baseURI;

        window.__viberails_asset_url__ = (path) => {
            const url = new URL(path, _assetBase);
            if (!window.__viberails_VSCODE__) {
                url.searchParams.set('v', window.__viberails_cache_bust__);
            }
            return url.toString();
        };

        const appStyleLink = document.createElement('link');
        appStyleLink.rel = 'stylesheet';
        appStyleLink.href = window.__viberails_asset_url__('style.css');
        document.head.appendChild(appStyleLink);
    </script>
</head>

<body>
    <!-- Combined Navigation Bar -->
    <nav class="app-subnav sticky-top">
        <div class="d-flex align-items-center">
            <button type="button" class="navbar-brand-sm animate-fade-up d-flex align-items-center gap-2">
                <img src="assets/img/logo.png" alt="Vibe Rails logo" class="brand-logo-sm" width="48" height="48">
                <span class="brand-text-sm">Vibe Rails</span>
            </button>
        </div>

        <div class="d-flex align-items-center justify-content-center flex-grow-1 gap-1">
            <button class="app-subnav-link" data-action="navigate" data-view="terminal-focus"
                title="Full-screen Terminal Workspace">
                <img src="assets/img/icons/terminal-solid-full.svg" alt="" class="me-1 icon-light">
                <span>Terminals</span>
            </button>
            <button class="app-subnav-link" data-action="navigate-home" title="Rules and project safeguards">
                <i class="fa-solid fa-list-check me-1"></i>
                <span>RULES</span>
            </button>
            <button class="app-subnav-link" data-action="navigate" data-view="environments"
                title="Manage Custom Environments & Sandboxes">
                <img src="assets/img/icons/layer-group-solid-full.svg" alt="" class="me-1 icon-light">
                <span>ENVS</span>
            </button>
            <button class="app-subnav-link" data-action="navigate" data-view="vibe-rails-ai"
                title="Vibe Rails AI — query and inspect captures">
                <i class="fa-solid fa-brain me-1"></i>
                <span>Vibe AI</span>
            </button>
            <button class="app-subnav-link" data-action="navigate" data-view="mcp"
                title="MCP Explorer — inspect and call tools on the local MCP server">
                <i class="fa-solid fa-plug me-1"></i>
                <span>MCP</span>
            </button>
            <button class="app-subnav-link" data-action="navigate" data-view="jobs"
                title="Durable scheduled and Git-triggered LLM Jobs">
                <i class="fa-solid fa-clock-rotate-left me-1"></i>
                <span>Jobs</span>
            </button>
            <button class="app-subnav-link" data-action="navigate-settings" title="Application Settings">
                <img src="assets/img/icons/sliders-solid-full.svg" alt="" class="me-1 icon-light settings-card-cog">
                <span>Settings</span>
            </button>
        </div>

        <div class="d-flex align-items-center ms-auto">
            <button id="exit-btn" class="nav-exit-btn-sm" title="Close VibeRails and stop backend">
                <svg class="nav-exit-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
                <span>Exit</span>
            </button>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container-fluid main-container">
        <div id="app-content"></div>
    </div>

    <!-- Footer -->
    <footer class="app-footer">
        <div class="container-fluid">
            <p class="mb-0">
                &copy; 2026 Robert Stokes &bull; All rights reserved &bull;
                <a href="https://viberails.ai/" target="_blank" rel="noopener noreferrer"
                    class="footer-link">viberails.ai</a>
            </p>
        </div>
    </footer>

    <!-- Templates -->
    <template id="dashboard-template">
        <div class="dashboard" data-dashboard="unified">
            <!-- Rules workspace. DashboardController mounts the Rules view here; the terminal
                 panel mounts into the [data-terminal-content] slot inside that view, directly
                 below the validation results. -->
            <div class="row mb-3">
                <div class="col-12 rules-dashboard-host" data-rules-overview-host></div>
            </div>
        </div>
    </template>

    <!-- Sandbox list item, rendered by SandboxController on the Sandboxes view. -->
    <template id="sandbox-item-template">
        <div class="sandbox-item-card" data-sandbox-item>
            <div class="d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-2 mb-2">
                <div class="d-flex flex-wrap align-items-center gap-2 flex-grow-1 min-w-0">
                    <span class="sandbox-item-name" data-sandbox-name></span>
                    <span class="sandbox-item-branch" data-sandbox-branch></span>
                    <span class="sandbox-item-path text-muted small" data-sandbox-path></span>
                </div>
                <span class="sandbox-item-time" data-sandbox-time></span>
            </div>
            <div class="row g-2 mt-3">
                <div class="col-12">
                    <div class="row g-2 row-cols-2 row-cols-xl-4">
                        <div class="col d-grid">
                            <button class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1 w-100"
                                type="button" data-sandbox-diff title="View Diff">
                                <i class="fa-solid fa-code-compare"></i>
                                <span>Diff</span>
                            </button>
                        </div>
                        <div class="col d-grid">
                            <button class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1 w-100"
                                type="button" data-sandbox-merge-local title="Merge into local branch">
                                <i class="fa-solid fa-code-merge"></i>
                                <span>Merge</span>
                            </button>
                        </div>
                        <div class="col d-grid">
                            <button class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1 w-100"
                                type="button" data-sandbox-push-remote title="Push to remote">
                                <i class="fa-solid fa-cloud-arrow-up"></i>
                                <span>Push</span>
                            </button>
                        </div>
                        <div class="col d-grid">
                            <button class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1 w-100"
                                type="button" data-sandbox-vscode title="Open in VS Code">
                                <img src="assets/img/vscode.svg" alt="" class="icon-light" style="width: 13px; height: 13px;">
                                <span>Code</span>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="col-12">
                    <div class="row g-2 align-items-stretch">
                        <div class="col-12 col-lg-4">
                            <select class="form-select form-select-sm sandbox-item-cli-select w-100"
                                data-sandbox-cli-select>
                                <option value="" disabled selected>Select LLM...</option>
                            </select>
                        </div>
                        <div class="col-12 col-sm-4 col-lg">
                            <div class="d-grid">
                                <button class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1 w-100"
                                    type="button" data-sandbox-launch-cli title="Native Terminal">
                                    <i class="fa-solid fa-terminal"></i>
                                    <span>Native</span>
                                </button>
                            </div>
                        </div>
                        <div class="col-12 col-sm-4 col-lg">
                            <div class="d-grid">
                                <button class="btn btn-sm btn-outline-success d-flex align-items-center gap-1 w-100"
                                    type="button" data-sandbox-launch-webui title="Web Terminal">
                                    <i class="fa-solid fa-display"></i>
                                    <span>Web</span>
                                </button>
                            </div>
                        </div>
                        <div class="col-12 col-sm-4 col-lg">
                            <div class="d-grid">
                                <button class="btn btn-sm btn-outline-danger d-flex align-items-center gap-1 w-100"
                                    type="button" data-sandbox-delete title="Delete sandbox">
                                    <i class="fa-solid fa-trash"></i>
                                    <span>Delete</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="agents-template">
        <div class="view rules-workspace" data-view="agents">

            <header class="rules-page-header">
                <div class="rules-page-heading">
                    <span class="rules-page-eyebrow">Project safeguards</span>
                    <h1>Rules</h1>
                    <p>Validate every uncommitted change, hand fixes to an agent, and watch code health — before
                        anything reaches a commit.</p>
                </div>
                <section class="rules-git-setting" data-hook-health data-tone="neutral" aria-busy="true"
                    aria-label="Git Guard setting">
                    <span class="rules-git-setting-icon" aria-hidden="true">
                        <i class="fa-solid fa-code-commit"></i>
                    </span>
                    <span class="rules-git-setting-copy">
                        <strong>Git Guard</strong>
                        <small data-hook-status-message>Checking repository hooks…</small>
                        <span class="visually-hidden" data-hook-status-title>Checking Git Guard</span>
                    </span>
                    <span class="hook-health-badge" data-hook-status-badge data-tone="neutral"
                        aria-live="polite">Checking</span>
                    <button class="rules-git-toggle" type="button" role="switch" aria-checked="false"
                        data-action="toggle-hooks" data-idle-label="Turn Git Guard on" disabled>
                        <span class="spinner-border spinner-border-sm" data-button-spinner hidden
                            aria-hidden="true"></span>
                        <span class="rules-git-toggle-track" data-button-icon aria-hidden="true">
                            <span></span>
                        </span>
                        <span class="visually-hidden" data-button-label>Turn Git Guard on</span>
                    </button>
                </section>
            </header>

            <div class="rules-rail">

                <!-- Validate: what blocks the commit right now -->
                <div class="rules-station" data-station="validate">
                    <span class="rules-station-node" aria-hidden="true"></span>
                    <section class="card rules-vca-panel vca-console-card" data-vca-console data-tone="neutral"
                        aria-busy="false" aria-labelledby="rules-vca-results-title">
                        <header class="rules-station-header">
                            <div class="rules-station-heading">
                                <span class="rules-station-eyebrow">Validate</span>
                                <div class="rules-station-title-row">
                                    <h2 id="rules-vca-results-title">Validation results</h2>
                                    <span class="rules-check-running" data-vca-console-spinner hidden
                                        aria-hidden="true">
                                        <span class="spinner-border spinner-border-sm"></span>
                                    </span>
                                    <span class="vca-console-state" data-vca-console-state>Ready</span>
                                </div>
                            </div>
                            <div class="rules-station-actions" aria-label="Validation result actions">
                                <button class="btn btn-sm btn-outline-secondary rules-icon-btn" type="button"
                                    data-action="copy-hook-output" aria-label="Copy validation results"
                                    title="Copy results">
                                    <i class="fa-regular fa-copy" aria-hidden="true"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-secondary rules-icon-btn" type="button"
                                    data-action="clear-hook-output" aria-label="Clear validation results"
                                    title="Clear results">
                                    <i class="fa-solid fa-eraser" aria-hidden="true"></i>
                                </button>
                                <button class="btn btn-sm btn-primary d-inline-flex align-items-center gap-2"
                                    type="button" data-action="run-hook-preview" data-idle-label="Run again" disabled>
                                    <span class="spinner-border spinner-border-sm" data-button-spinner hidden
                                        aria-hidden="true"></span>
                                    <i class="fa-solid fa-rotate-right" data-button-icon aria-hidden="true"></i>
                                    <span data-button-label>Run again</span>
                                </button>
                            </div>
                        </header>
                        <div class="rules-station-body rules-vca-results">
                            <section class="vca-explanation" data-vca-explanation hidden aria-live="polite">
                                <div class="vca-explanation-verdict" data-vca-explanation-verdict data-tone="neutral">
                                    <span class="vca-explanation-icon" aria-hidden="true">
                                        <i class="fa-solid fa-circle-check"></i>
                                    </span>
                                    <div class="vca-explanation-copy">
                                        <span class="vca-explanation-eyebrow">What this means</span>
                                        <h3 data-vca-explanation-title>Validation ready</h3>
                                        <p data-vca-explanation-message>Run validation to review your uncommitted
                                            changes.</p>
                                    </div>
                                    <div class="vca-explanation-stats" data-vca-explanation-stats></div>
                                </div>
                                <div class="vca-finding-list" data-vca-finding-list></div>
                                <div class="vca-explanation-actions" data-vca-explanation-actions hidden>
                                    <button class="btn btn-sm btn-primary" type="button"
                                        data-action="open-fix-terminal">
                                        <i class="fa-solid fa-terminal me-1" aria-hidden="true"></i>
                                        Fix with an agent
                                    </button>
                                    <button class="btn btn-sm btn-outline-secondary" type="button"
                                        data-action="copy-fix-brief">
                                        <i class="fa-regular fa-copy me-1" aria-hidden="true"></i>
                                        Copy fix brief
                                    </button>
                                </div>
                            </section>
                            <details class="rules-console-transcript">
                                <summary>
                                    <span class="vca-console-pulse" aria-hidden="true"></span>
                                    <span class="rules-console-transcript-label">Console transcript</span>
                                    <small data-vca-console-meta>Waiting for validation</small>
                                </summary>
                                <div class="vca-console-shell">
                                    <pre class="vca-console-output" data-vca-console-output role="log"
                                        aria-live="polite" aria-atomic="false" tabindex="0"></pre>
                                </div>
                            </details>
                        </div>
                    </section>
                </div>

                <!-- Fix: the agent terminal sits directly under the findings it fixes -->
                <div class="rules-station" data-station="fix">
                    <span class="rules-station-node" aria-hidden="true"></span>
                    <section class="rules-terminal-station" data-terminal-section
                        aria-label="Agent terminal">
                        <header class="rules-station-header rules-station-header-bare">
                            <div class="rules-station-heading">
                                <span class="rules-station-eyebrow">Fix</span>
                                <div class="rules-station-title-row">
                                    <h2>Agent terminal</h2>
                                </div>
                            </div>
                            <p class="rules-station-hint">Start an agent here and hand it the fix brief from the
                                results above.</p>
                        </header>
                        <div class="rules-station-body" data-terminal-content>
                            <!-- Terminal panel rendered here -->
                        </div>
                    </section>
                </div>

                <!-- Measure: working-tree code quality analysis -->
                <div class="rules-station" data-station="measure">
                    <span class="rules-station-node" aria-hidden="true"></span>
                    <section class="card code-analyzer-panel vca-console-card" data-code-analyzer-console
                        data-tone="neutral" aria-busy="false" aria-labelledby="code-analyzer-title">
                        <header class="rules-station-header">
                            <div class="rules-station-heading">
                                <span class="rules-station-eyebrow">Measure</span>
                                <div class="rules-station-title-row">
                                    <h2 id="code-analyzer-title">Code quality</h2>
                                    <span class="rules-station-note">
                                        <i class="fa-solid fa-code-commit" aria-hidden="true"></i>
                                        Working tree analysis
                                    </span>
                                    <span class="rules-check-running" data-vca-console-spinner hidden
                                        aria-hidden="true">
                                        <span class="spinner-border spinner-border-sm"></span>
                                    </span>
                                    <span class="vca-console-state" data-vca-console-state>Ready</span>
                                </div>
                            </div>
                            <div class="rules-station-actions" aria-label="Code quality actions">
                                <label class="mintlint-scan-toggle"
                                    title="Usage counts normally consider tracked files only. Check to scan every source file under the repository, including untracked ones.">
                                    <input type="checkbox" data-code-analyzer-full-scan>
                                    <span>Full repo scan</span>
                                </label>
                                <button class="btn btn-sm btn-outline-secondary rules-icon-btn" type="button"
                                    data-action="copy-code-analyzer-output" aria-label="Copy scan summary"
                                    title="Copy scan summary">
                                    <i class="fa-regular fa-copy" aria-hidden="true"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-secondary rules-icon-btn" type="button"
                                    data-action="clear-code-analyzer-output" aria-label="Clear code quality results"
                                    title="Clear results">
                                    <i class="fa-solid fa-eraser" aria-hidden="true"></i>
                                </button>
                                <button class="btn btn-sm btn-primary d-inline-flex align-items-center gap-2"
                                    type="button" data-action="run-code-analyzer" data-idle-label="Run again">
                                    <span class="spinner-border spinner-border-sm" data-button-spinner hidden
                                        aria-hidden="true"></span>
                                    <i class="fa-solid fa-rotate-right" data-button-icon aria-hidden="true"></i>
                                    <span data-button-label>Run again</span>
                                </button>
                            </div>
                        </header>

                        <div class="code-analyzer-empty" data-code-analyzer-empty>
                            <span class="code-analyzer-empty-icon" aria-hidden="true">
                                <i class="fa-solid fa-chart-line"></i>
                            </span>
                            <div>
                                <strong>Preparing code quality</strong>
                                <p>Your staged, unstaged, and untracked changes will be organized into an overview,
                                    file metrics, and source evidence.</p>
                            </div>
                        </div>

                        <div class="code-analyzer-dashboard" data-code-analyzer-report hidden></div>

                        <details class="rules-console-transcript code-analyzer-transcript">
                            <summary>
                                <span class="vca-console-pulse" aria-hidden="true"></span>
                                <span class="rules-console-transcript-label">Scan transcript</span>
                                <small data-vca-console-meta>Waiting for analysis</small>
                            </summary>
                            <div class="vca-console-shell">
                                <pre class="vca-console-output" data-vca-console-output role="log" aria-live="polite"
                                    aria-atomic="false" tabindex="0"></pre>
                            </div>
                        </details>

                        <footer class="code-analyzer-note">
                            <span>Risk scores are normalized so higher always means more risk.</span>
                            <span class="code-analyzer-legend">
                                <span><i data-tone="success"></i>Healthy</span>
                                <span><i data-tone="warning"></i>Review</span>
                                <span><i data-tone="danger"></i>Change required</span>
                            </span>
                        </footer>
                    </section>
                </div>

                <!-- Govern: the AGENTS.md files every check above enforces -->
                <div class="rules-station" data-station="automate">
                    <span class="rules-station-node" aria-hidden="true"></span>
                    <section class="card jobs-automation-station" aria-labelledby="rules-automation-title">
                        <header class="rules-station-header">
                            <div class="rules-station-heading">
                                <span class="rules-station-eyebrow">Automate</span>
                                <div class="rules-station-title-row">
                                    <h2 id="rules-automation-title">LLM Jobs</h2>
                                    <span class="rules-station-note">Real hooks only — previews never queue jobs</span>
                                </div>
                            </div>
                            <div class="rules-station-actions">
                                <button class="btn btn-sm btn-outline-secondary" type="button" data-action="new-vca-job">+ VCA job</button>
                                <button class="btn btn-sm btn-outline-secondary" type="button" data-action="new-commit-job">+ Commit job</button>
                                <button class="btn btn-sm btn-primary" type="button" data-action="open-jobs">Open Jobs</button>
                            </div>
                        </header>
                        <div class="rules-station-body" data-jobs-automation-host></div>
                    </section>
                </div>

                <!-- Govern: the AGENTS.md files every check above enforces -->
                <div class="rules-station" data-station="govern">
                    <span class="rules-station-node" aria-hidden="true"></span>
                    <section class="card rules-files-card" aria-labelledby="rules-files-title">
                        <header class="rules-station-header">
                            <div class="rules-station-heading">
                                <span class="rules-station-eyebrow">Govern</span>
                                <div class="rules-station-title-row">
                                    <h2 id="rules-files-title">Rule files</h2>
                                    <span class="rules-station-note">AGENTS.md policies these checks enforce</span>
                                </div>
                            </div>
                            <div class="rules-station-actions">
                                <button class="btn btn-sm btn-primary d-flex align-items-center gap-2" type="button"
                                    data-action="create-agent-file" title="Create a new AGENTS.md file">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                        viewBox="0 0 16 16">
                                        <path
                                            d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4" />
                                    </svg>
                                    New AGENTS.md
                                </button>
                            </div>
                        </header>
                        <div class="rules-station-body">
                            <div data-agent-file-tree></div>
                        </div>
                    </section>
                </div>

            </div>
        </div>
    </template>

    <template id="agent-edit-template">
        <div class="view" data-view="agent-edit">
            <div class="row mb-4">
                <div class="col-12 d-flex align-items-center gap-4">
                    <button class="btn btn-outline-primary" type="button" data-action="go-back">
                        &larr; Back
                    </button>
                    <div class="d-flex align-items-center gap-3">
                        <div>
                            <h4 class="mb-0 text-white fw-semibold" data-agent-display-name></h4>
                            <small class="text-muted" data-agent-path></small>
                        </div>
                        <button class="btn btn-sm btn-outline-secondary ms-2 d-flex align-items-center gap-2"
                            type="button" data-action="set-custom-agent-name">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor"
                                viewBox="0 0 16 16">
                                <path
                                    d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325" />
                            </svg>
                            Edit name
                        </button>

                /* ─── BERT Inspector: Diagnostic Lab Instrument ─── */

                    /* One row per child, in order: captures, masthead, diagnostics, cols, query,

    <script>
        const loadVibeRailsScript = (src, type) => new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = window.__viberails_asset_url__(src);
            if (type) {
                script.type = type;
            }
            if (window.__viberails_NONCE__) {
                script.nonce = window.__viberails_NONCE__;
            }
            script.onload = resolve;
            script.onerror = () => reject(new Error(`Failed to load ${src}`));
            document.body.appendChild(script);
        });

        (async () => {
            await loadVibeRailsScript('js/performance-mode.js');
            await loadVibeRailsScript('js/background-effect.js');
            await loadVibeRailsScript('app.js', 'module');
        })().catch((error) => {
            console.error('Failed to load VibeRails assets:', error);
        });
    </script>
