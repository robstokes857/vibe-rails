<!DOCTYPE html>

    <title>Vibe Rails</title>
    <link rel="icon" type="image/x-icon" href="assets/img/logo.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap">

    <link rel="stylesheet" href="assets/not-a-toast.css" />
    <style>
        /* Hide nav until app stylesheet loads to prevent FOUC */
        .app-subnav { opacity: 0; }
    </style>
    <script>
        window.__viberails_cache_bust__ = Date.now().toString(36);

        const _styleBase = (window.__viberails_VSCODE__ && window.__viberails_ASSETS_BASE__)
            ? window.__viberails_ASSETS_BASE__.replace(/\/$/, '') + '/'
            : document.baseURI;
        const appStyleUrl = new URL('style.css', _styleBase);
        if (!window.__viberails_VSCODE__) {
            appStyleUrl.searchParams.set('v', window.__viberails_cache_bust__);
        }

        const appStyleLink = document.createElement('link');
        appStyleLink.rel = 'stylesheet';
        appStyleLink.href = appStyleUrl.toString();
        document.head.appendChild(appStyleLink);
    </script>
</head>

<body>

    <template id="sandbox-item-template">
        <div class="sandbox-item-card" data-sandbox-item>
            <div class="sandbox-item-header">
                <div class="sandbox-item-info">
                    <span class="sandbox-item-name" data-sandbox-name></span>
                    <span class="sandbox-item-branch" data-sandbox-branch></span>
                    <span class="sandbox-item-path text-muted small" data-sandbox-path></span>
                </div>
                <span class="sandbox-item-time" data-sandbox-time></span>
            </div>
            <div class="sandbox-item-actions mt-3 d-flex flex-column gap-2">
                <!-- Row 1: Git & Code Actions -->
                <div class="sandbox-item-git-actions d-flex gap-2">
                    <button class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1 flex-grow-1"
                        type="button" data-sandbox-diff title="View Diff">
                        <i class="fa-solid fa-code-compare"></i>
                        <span>Diff</span>
                    </button>
                    <button class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1 flex-grow-1"
                        type="button" data-sandbox-merge-local title="Merge into local branch">
                        <i class="fa-solid fa-code-merge"></i>
                        <span>Merge</span>
                    </button>
                    <button class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1 flex-grow-1"
                        type="button" data-sandbox-push-remote title="Push to remote">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <span>Push</span>
                    </button>
                    <button class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1 flex-grow-1"

                        <img src="assets/img/vscode.svg" alt="" class="icon-light" style="width: 13px; height: 13px;">
                        <span>Code</span>
                    </button>
                </div>

                <!-- Row 2: Launch Actions -->
                <div class="sandbox-item-launch d-flex gap-2">
                    <select class="form-select form-select-sm sandbox-item-cli-select flex-grow-1"
                        data-sandbox-cli-select style="width: auto; min-width: 140px;">
                        <option value="" disabled selected>Select LLM...</option>
                    </select>
                    <button class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1 flex-grow-1"
                        type="button" data-sandbox-launch-cli title="Native Terminal">
                        <i class="fa-solid fa-terminal"></i>

                    </button>
                    <button class="btn btn-sm btn-outline-success d-flex align-items-center gap-1 flex-grow-1"
                        type="button" data-sandbox-launch-webui title="Web Terminal">
                        <i class="fa-solid fa-display"></i>
                        <span>Web</span>
                    </button>
                    <button class="btn btn-sm btn-outline-danger d-flex align-items-center gap-1 flex-grow-1"
                        type="button" data-sandbox-delete title="Delete sandbox">
                        <i class="fa-solid fa-trash"></i>
                        <span>Delete</span>

            </div>
