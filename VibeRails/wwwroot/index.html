    <style>
        /* Hide nav until app stylesheet loads to prevent FOUC */
        .app-subnav { opacity: 0; }
    </style>
    <script>
        window.__viberails_cache_bust__ = Date.now().toString(36);

        const _assetBase = (window.__viberails_VSCODE__ && window.__viberails_ASSETS_BASE__)
            ? window.__viberails_ASSETS_BASE__.replace(/\/$/, '') + '/'
            : document.baseURI;

        window.__viberails_asset_url__ = (path) => {
            const url = new URL(path, _assetBase);
            if (!window.__viberails_VSCODE__) {
                url.searchParams.set('v', window.__viberails_cache_bust__);
            }
            return url.toString();
        };

        const appStyleLink = document.createElement('link');
        appStyleLink.rel = 'stylesheet';
        appStyleLink.href = window.__viberails_asset_url__('style.css');
        document.head.appendChild(appStyleLink);
    </script>
</head>

                .mcp-view .mcp-tool-desc { font-size:0.75rem; color: var(--color-text-muted); line-height:1.5; }
                .mcp-view .mcp-control { width:100%; padding:0.5rem 0.75rem; border-radius:4px; border:1px solid var(--color-border); background: var(--color-bg-base); color: var(--color-text); font:inherit; font-size:0.875rem; transition: border-color var(--transition-speed) ease; }

                .mcp-view .mcp-button:hover { border-color: var(--color-primary); }
                .mcp-view .mcp-button.primary { background: var(--color-primary); border-color: var(--color-primary); color:#fff; }
                .mcp-view .mcp-button.primary:hover { background: var(--color-primary-dark); border-color: var(--color-primary-dark); }
                .mcp-view .mcp-button:disabled { opacity:0.5; cursor:not-allowed; }
                .mcp-view pre.mcp-pre { margin:0; padding:0.85rem 1rem; border-radius:6px; border:1px solid var(--color-border); background: var(--color-bg-base); color: var(--color-text); white-space:pre-wrap; word-break:break-word; line-height:1.55; overflow:auto; font-size:0.8rem; font-family: 'JetBrains Mono', 'Fira Code', monospace; }
                .mcp-view .mcp-empty { display:grid; place-items:center; min-height:100px; padding:1.5rem; text-align:center; color: var(--color-text-muted); border:1px dashed var(--color-border); border-radius:6px; background: rgba(255,255,255,0.02); line-height:1.6; font-size:0.825rem; }
                .mcp-view .mcp-banner { color: var(--color-text-muted); font-size:0.75rem; margin-top:0.5rem; }
                .mcp-view .mcp-banner.error { color: var(--color-danger); }
                .mcp-view .mcp-banner.success { color: var(--color-success); }
                .mcp-view .mcp-paths { padding:0 1rem 1rem; display:grid; gap:0.65rem; }
                .mcp-view .mcp-paths label { font-size:0.6rem; color: var(--color-text-muted); text-transform:uppercase; letter-spacing:0.08em; font-weight:700; }
                .mcp-view .mcp-paths code { display:block; padding:0.55rem 0.7rem; border-radius:4px; background: var(--color-bg-base); border:1px solid var(--color-border); white-space:pre-wrap; word-break:break-word; color: var(--color-accent); line-height:1.5; font-size:0.75rem; font-family: 'JetBrains Mono', 'Fira Code', monospace; }
                .mcp-view details.mcp-details { margin-top:0.85rem; border:1px solid var(--color-border); border-radius:6px; background: rgba(255,255,255,0.02); }
                .mcp-view details.mcp-details summary { cursor:pointer; padding:0.75rem 0.9rem; color: var(--color-text); list-style:none; font-size:0.8rem; font-weight:600; }
                .mcp-view details.mcp-details summary::-webkit-details-marker { display:none; }
                @media (max-width:1180px){ .mcp-view .mcp-main { grid-template-columns:1fr; } }
                @media (max-width:820px){ .mcp-view .mcp-hero { padding:1.25rem; flex-direction:column; } .mcp-view .mcp-grid { grid-template-columns:1fr; } .mcp-view .mcp-counts { justify-content:flex-start; } }
            </style>

                    </div>
                    <div class="mcp-counts">

                <div class="mcp-main">

                            <div><strong>Status</strong><div class="mcp-subtitle">MCP server health</div></div>

    <script>
        const loadVibeRailsScript = (src, type) => new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = window.__viberails_asset_url__(src);
            if (type) {
                script.type = type;
            }
            if (window.__viberails_NONCE__) {
                script.nonce = window.__viberails_NONCE__;
            }
            script.onload = resolve;
            script.onerror = () => reject(new Error(`Failed to load ${src}`));
            document.body.appendChild(script);
        });

        (async () => {
            await loadVibeRailsScript('js/performance-mode.js');
            await loadVibeRailsScript('js/background-effect.js');
            await loadVibeRailsScript('app.js', 'module');
        })().catch((error) => {
            console.error('Failed to load VibeRails assets:', error);
        });
    </script>
