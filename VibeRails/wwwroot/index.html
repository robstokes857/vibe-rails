<!DOCTYPE html>

    <title>Vibe Rails</title>
    <link rel="icon" type="image/x-icon" href="assets/img/logo.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap">

    <link rel="stylesheet" href="assets/not-a-toast.css" />
    <style>
        /* Hide nav until app stylesheet loads to prevent FOUC */
        .app-subnav { opacity: 0; }
    </style>
    <script>
        window.__viberails_cache_bust__ = Date.now().toString(36);

        const _styleBase = (window.__viberails_VSCODE__ && window.__viberails_ASSETS_BASE__)
            ? window.__viberails_ASSETS_BASE__.replace(/\/$/, '') + '/'
            : document.baseURI;
        const appStyleUrl = new URL('style.css', _styleBase);
        if (!window.__viberails_VSCODE__) {
            appStyleUrl.searchParams.set('v', window.__viberails_cache_bust__);
        }

        const appStyleLink = document.createElement('link');
        appStyleLink.rel = 'stylesheet';
        appStyleLink.href = appStyleUrl.toString();
        document.head.appendChild(appStyleLink);
    </script>
</head>

<body>

    <template id="sandbox-item-template">
        <div class="sandbox-item-card" data-sandbox-item>
            <div class="sandbox-item-header">
                <div class="sandbox-item-info">
                    <span class="sandbox-item-name" data-sandbox-name></span>
                    <span class="sandbox-item-branch" data-sandbox-branch></span>
                    <span class="sandbox-item-path text-muted small" data-sandbox-path></span>
                </div>
                <span class="sandbox-item-time" data-sandbox-time></span>
            </div>
            <div class="sandbox-item-actions mt-3 d-flex flex-column gap-2">
                <!-- Row 1: Git & Code Actions -->
                <div class="sandbox-item-git-actions d-flex gap-2">
                    <button class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1 flex-grow-1"
                        type="button" data-sandbox-diff title="View Diff">
                        <i class="fa-solid fa-code-compare"></i>
                        <span>Diff</span>
                    </button>
                    <button class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1 flex-grow-1"
                        type="button" data-sandbox-merge-local title="Merge into local branch">
                        <i class="fa-solid fa-code-merge"></i>
                        <span>Merge</span>
                    </button>
                    <button class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1 flex-grow-1"
                        type="button" data-sandbox-push-remote title="Push to remote">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <span>Push</span>
                    </button>
                    <button class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1 flex-grow-1"

                        <img src="assets/img/vscode.svg" alt="" class="icon-light" style="width: 13px; height: 13px;">
                        <span>Code</span>
                    </button>
                </div>

                <!-- Row 2: Launch Actions -->
                <div class="sandbox-item-launch d-flex gap-2">
                    <select class="form-select form-select-sm sandbox-item-cli-select flex-grow-1"
                        data-sandbox-cli-select style="width: auto; min-width: 140px;">
                        <option value="" disabled selected>Select LLM...</option>
                    </select>
                    <button class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1 flex-grow-1"
                        type="button" data-sandbox-launch-cli title="Native Terminal">
                        <i class="fa-solid fa-terminal"></i>

                    </button>
                    <button class="btn btn-sm btn-outline-success d-flex align-items-center gap-1 flex-grow-1"
                        type="button" data-sandbox-launch-webui title="Web Terminal">
                        <i class="fa-solid fa-display"></i>
                        <span>Web</span>
                    </button>
                    <button class="btn btn-sm btn-outline-danger d-flex align-items-center gap-1 flex-grow-1"
                        type="button" data-sandbox-delete title="Delete sandbox">
                        <i class="fa-solid fa-trash"></i>
                        <span>Delete</span>

            </div>

                            <h5 class="menu-title">Configure Codex</h5>
                        </div>
                    </div>
                </div>

                <div class="col-md-4 mb-4">
                    <div class="card menu-card" data-action="configure-cli" data-cli="claude">
                        <div class="card-body text-center">
                            <img class="cli-logo mb-3" src="assets/img/claude-color.svg" alt="Claude logo">
                            <h5 class="menu-title">Configure Claude</h5>
                        </div>
                    </div>
                </div>

                <div class="col-md-4 mb-4">
                    <div class="card menu-card" data-action="configure-cli" data-cli="gemini">
                        <div class="card-body text-center">
                            <img class="cli-logo mb-3" src="assets/img/gemini-color.svg" alt="Gemini logo">
                            <h5 class="menu-title">Configure Gemini</h5>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="settings-template">
        <div class="view" data-view="settings">
            <div class="row justify-content-center text-center">
                <div class="col-md-8 col-lg-6 mb-4">
                    <h2 class="text-uppercase fw-bold" style="letter-spacing: 0.05em;"><span
                            class="text-gradient">Application Settings</span></h2>
                </div>
            </div>
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6 mb-4">
                    <div class="sandbox-item-card mb-3 text-start">
                        <div class="sandbox-item-header mb-3">
                            <span class="sandbox-item-name">Remote PIN Lock</span>
                        </div>
                        <div class="pin-section-row mb-3">
                            <div>
                                <div class="form-label mb-1">PIN Status</div>
                                <div id="pin-status-badge" class="pin-status-badge not-set">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor"
                                        viewBox="0 0 16 16">
                                        <path
                                            d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2m3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2" />
                                    </svg>
                                    Not Set
                                </div>
                            </div>
                            <div class="pin-section-actions">
                                <button type="button"
                                    class="btn btn-outline-primary btn-sm d-flex align-items-center gap-2"
                                    id="btn-set-pin">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor"
                                        viewBox="0 0 16 16">
                                        <path
                                            d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2m3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2" />
                                    </svg>
                                    Set PIN
                                </button>
                                <button type="button"
                                    class="btn btn-outline-danger btn-sm d-flex align-items-center gap-2"
                                    id="btn-clear-pin" style="display:none!important">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor"
                                        viewBox="0 0 16 16">
                                        <path
                                            d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z" />
                                    </svg>
                                    Clear PIN
                                </button>
                            </div>
                        </div>
                        <small class="form-text text-muted">Protect remote viewer access with a 4–6 digit PIN
                            challenge</small>
                    </div>
                </div>
            </div>
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="sandbox-item-card text-start">
                        <div class="sandbox-item-header mb-3">
                            <span class="sandbox-item-name">Application Settings</span>
                        </div>
                        <form id="app-settings-form">
                            <div class="mb-4">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="setting-remote-access">
                                    <label class="form-check-label" for="setting-remote-access">Turn on Remote
                                        Access</label>
                                </div>
                                <small class="form-text text-muted">Allow remote connections to this VibeRails
                                    instance</small>
                            </div>
                            <div class="mb-4">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="setting-performance-mode">
                                    <label class="form-check-label" for="setting-performance-mode">Performance
                                        Mode</label>
                                </div>
                                <small class="form-text text-muted">Disable background animations to reduce CPU
                                    usage</small>
                            </div>
                            <div class="mb-4">
                                <label class="form-label" for="setting-api-key">API Key</label>
                                <input type="text" class="form-control" id="setting-api-key"
                                    placeholder="Enter API key">
                                <small class="form-text text-muted">API key for authenticating remote requests</small>
                            </div>
                            <div class="mb-4">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="setting-enable-prerelease">
                                    <label class="form-check-label" for="setting-enable-prerelease">Enable
                                        Prerelease</label>
                                </div>
                                <small class="form-text text-muted">Show experimental and prerelease features</small>
                            </div>
                            <div class="mb-4">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="setting-developer-options">
                                    <label class="form-check-label" for="setting-developer-options">Developer
                                        Options</label>
                                </div>
                                <small class="form-text text-muted">Enable developer-focused options in the app</small>
                            </div>
                            <button type="submit" class="btn btn-primary d-flex align-items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                    viewBox="0 0 16 16">
                                    <path d="M11 2H9v3h2z" />
                                    <path
                                        d="M1.5 0h11.586a1.5 1.5 0 0 1 1.06.44l1.415 1.414A1.5 1.5 0 0 1 16 2.914V14.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 0 14.5v-13A1.5 1.5 0 0 1 1.5 0M1 1.5v13a.5.5 0 0 0 .5.5H2v-4.5A1.5 1.5 0 0 1 3.5 9h9a1.5 1.5 0 0 1 1.5 1.5V15h.5a.5.5 0 0 0 .5-.5V2.914a.5.5 0 0 0-.146-.353l-1.415-1.415A.5.5 0 0 0 13.086 1H13v4.5A1.5 1.5 0 0 1 11.5 7h-7A1.5 1.5 0 0 1 3 5.5V1H1.5a.5.5 0 0 0-.5.5m3 4a.5.5 0 0 0 .5.5h7a.5.5 0 0 0 .5-.5V1H4zM3 15h10v-4.5a.5.5 0 0 0-.5-.5h-9a.5.5 0 0 0-.5.5z" />
                                </svg>
                                Save Settings
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="session-item-template">
        <div class="list-group-item session-item p-3" data-session-item>
            <div class="d-flex align-items-center gap-3">
                <div class="project-logo-wrapper">
                    <img class="project-logo" data-session-logo alt="" loading="lazy">
                </div>
                <div class="flex-grow-1 min-w-0">
                    <div class="d-flex align-items-center mb-1">
                        <span class="badge badge-cli me-2" data-session-badge></span>
                        <span class="text-muted small" data-session-time></span>
                    </div>
                    <div class="project-path text-muted text-truncate mb-1" data-session-workdir></div>
                    <div class="d-flex align-items-center text-muted small" data-session-env-container>
                        <!-- Env info will go here -->
                    </div>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="badge" data-session-status></span>
                </div>
            </div>
        </div>
    </template>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container"></div>

    <!-- Modal Container -->
    <div id="modal-container"></div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay d-none">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <script src="assets/not-a-toast.umd.js"></script>
    <script src="assets/bootstrap.bundle.min.js"></script>
    <script src="assets/xterm/xterm.min.js"></script>
    <script src="assets/xterm/addon-fit.js"></script>
    <script src="assets/xterm/addon-webgl.js"></script>
    <script src="assets/xterm/addon-search.js"></script>
    <script src="assets/xterm/addon-web-links.js"></script>
    <script src="assets/xterm/addon-web-fonts.js"></script>
    <script src="assets/xterm/addon-attach.js"></script>
    <script src="assets/xterm/addon-progress.js"></script>
    <script src="assets/xterm/addon-unicode-graphemes.js"></script>
    <script src="assets/xterm/addon-clipboard.js"></script>
    <script src="assets/xterm/terminal-themes.js"></script>
    <script src="assets/sortable.min.js"></script>
    <script src="assets/monaco/vs/loader.js"></script>
    <script src="js/performance-mode.js"></script>
    <script src="js/background-effect.js"></script>
    <script type="module" src="app.js"></script>
</body>

</html>
