<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeRails BERT Explorer</title>
<link rel="stylesheet" href="assets/xterm/xterm.css" />
<style>
:root{--bg:#08111a;--bg2:#0d1725;--panel:#0f1d2f;--panel2:#13233a;--line:#24405f;--text:#edf5ff;--muted:#91a6c5;--accent:#70e6ff;--accent2:#65a6ff;--ok:#7cf0b3;--warn:#ffc86d;--bad:#ff9696}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font-family:"Cascadia Code","JetBrains Mono",Consolas,monospace;color:var(--text);background:radial-gradient(circle at top left,rgba(101,166,255,.22),transparent 28%),linear-gradient(180deg,#07111a,#0a1320 45%,#060a11)}

.shell{max-width:1800px;margin:0 auto;padding:16px;display:grid;gap:12px;height:100vh;grid-template-rows:auto auto 1fr}
.panel{border:1px solid var(--line);border-radius:16px;background:rgba(12,21,34,.92);box-shadow:0 12px 40px rgba(0,0,0,.28);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.head{padding:12px 16px;border-bottom:1px solid rgba(145,166,197,.14);display:flex;justify-content:space-between;gap:10px;align-items:center;background:linear-gradient(180deg,var(--panel2),var(--panel));flex-shrink:0}
.head strong{font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.body{padding:14px;overflow:auto;min-height:0;flex:1}
.body::-webkit-scrollbar{width:8px;height:8px}.body::-webkit-scrollbar-thumb{background:rgba(112,230,255,.18);border-radius:999px}

/* --- Top bar --- */
.topbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 18px;border:1px solid var(--line);border-radius:16px;background:rgba(12,21,34,.92)}
.topbar h1{font-size:16px;white-space:nowrap}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
.stats{display:flex;gap:14px;margin-left:auto;font-size:12px;color:var(--muted);flex-shrink:0}
.stats b{color:var(--text);margin-left:3px}
.pill,.chip{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:11px;border:1px solid transparent;white-space:nowrap}
.pill.ok{background:var(--ok);color:#04120b}.pill.warn{background:var(--warn);color:#2d1b00}.pill.bad{background:var(--bad);color:#350d0d}
.chip{border-color:rgba(112,230,255,.16);background:rgba(10,17,28,.84);color:var(--text)}
.status-pills{display:flex;gap:6px;flex-wrap:wrap}

/* --- Query bar --- */
.query-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border:1px solid var(--line);border-radius:16px;background:rgba(12,21,34,.92)}
.query-bar input[type="text"]{flex:1;min-width:200px}
.control,.button{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:#09121e;color:var(--text);font:inherit;font-size:13px}
.button{cursor:pointer;background:linear-gradient(180deg,rgba(18,33,54,.92),rgba(11,19,32,.92))}
.button.primary{background:linear-gradient(180deg,rgba(101,166,255,.25),rgba(45,89,151,.3));border-color:rgba(101,166,255,.45)}
.button:disabled{opacity:.55;cursor:default}
.banner{font-size:12px;color:var(--muted);white-space:nowrap}.banner.error{color:var(--bad)}.banner.success{color:var(--ok)}

/* --- Main split --- */
.main{display:grid;grid-template-columns:minmax(340px,.45fr) 1fr;gap:12px;min-height:0;overflow:hidden}

/* --- Results list --- */
.list{display:grid;gap:8px;align-content:start}
.item{width:100%;text-align:left;padding:11px 13px;border-radius:14px;border:1px solid rgba(101,166,255,.1);background:linear-gradient(180deg,rgba(16,28,46,.88),rgba(10,18,30,.88));color:inherit;display:grid;gap:6px;cursor:pointer;font-size:13px}
.item:hover{border-color:rgba(112,230,255,.25);background:linear-gradient(180deg,rgba(18,32,52,.95),rgba(12,22,36,.95))}
.item.sel{border-color:rgba(112,230,255,.5);background:linear-gradient(180deg,rgba(22,40,65,.98),rgba(13,24,40,.98))}
.item-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.item-chips{display:flex;gap:5px;flex-wrap:wrap;min-width:0}
.item-text{line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;color:var(--muted)}
.item-bottom{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:rgba(145,166,197,.6);text-transform:uppercase}
.score-chip{font-weight:bold;font-size:12px;flex-shrink:0}
.score-chip.high{color:var(--ok)}.score-chip.mid{color:var(--warn)}.score-chip.low{color:var(--bad)}
.empty{display:grid;place-items:center;min-height:120px;padding:24px;text-align:center;color:var(--muted);border:1px dashed rgba(145,166,197,.18);border-radius:14px;background:rgba(8,14,24,.55);line-height:1.7;font-size:13px}

/* --- Detail panel --- */
.detail{display:grid;gap:14px}
.session-actions{display:flex;gap:10px;flex-wrap:wrap}
.session-actions .button{padding:9px 14px;font-size:12px;display:inline-flex;align-items:center}
.score-banner{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;border:1px solid rgba(112,230,255,.15);background:rgba(10,18,30,.9)}
.score-bar-track{flex:1;height:8px;border-radius:99px;background:rgba(145,166,197,.12);overflow:hidden}
.score-bar-fill{height:100%;border-radius:99px;transition:width .3s}
.score-value{font-size:24px;font-weight:bold;min-width:70px;text-align:right}
.score-label{font-size:11px;color:var(--muted);text-transform:uppercase}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.meta-card{padding:10px 12px;border-radius:12px;border:1px solid rgba(112,230,255,.1);background:rgba(10,18,30,.8);display:grid;gap:2px}
.meta-card .label{font-size:10px;color:var(--muted);text-transform:uppercase}
.meta-card .value{font-size:13px;word-break:break-all}
.meta-card code{font-size:12px;color:#dbe9ff;word-break:break-all}
.section{display:grid;gap:8px}.section h3{font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
pre{padding:14px;border-radius:14px;border:1px solid rgba(101,166,255,.12);background:#08111c;color:#dbe9ff;white-space:pre-wrap;word-break:break-word;line-height:1.6;overflow:auto;font-size:12px;max-height:300px}
.ftable{overflow:auto;border:1px solid rgba(101,166,255,.12);border-radius:14px;background:#08111c}
table{width:100%;border-collapse:collapse}th,td{padding:9px 12px;text-align:left;border-bottom:1px solid rgba(145,166,197,.08);font-size:12px}
th{font-size:10px;color:var(--muted);text-transform:uppercase;background:#0b1420}
details{border:1px solid rgba(101,166,255,.12);border-radius:14px;background:rgba(10,17,28,.76)}
summary{cursor:pointer;padding:11px 14px;color:var(--text);list-style:none;font-size:12px}summary::-webkit-details-marker{display:none}
details pre{border:none;border-radius:0;border-top:1px solid rgba(101,166,255,.1)}

@media(max-width:1000px){.main{grid-template-columns:1fr;grid-template-rows:minmax(200px,.4fr) 1fr}}
@media(max-width:700px){.query-bar{flex-direction:column}.stats{margin-left:0}}
</style>
</head>
<body>
<div class="shell">

<!-- Top bar: title + compact status -->
<div class="topbar">
  <div>
    <div class="eyebrow">BERT Input Explorer</div>
    <h1>Query &amp; Inspect Captures</h1>
  </div>
  <div class="status-pills" id="status-pills"></div>
  <div class="stats">
    <span>Docs<b id="docs">0</b></span>
    <span>Sessions<b id="sessions">0</b></span>
    <span>Queries<b id="queries">0</b></span>
  </div>
</div>

<!-- Query bar -->
<form class="query-bar" id="form">
  <input class="control" id="query" type="text" placeholder="Search prompts, diffs, or intent..." autocomplete="off">
  <select class="control" id="mode" style="width:140px">
    <option value="semantic">Semantic</option>
    <option value="text">Text</option>
  </select>
  <input class="control" id="topk" type="number" min="1" max="50" value="10" style="width:70px" title="Top K results">
  <button class="button primary" id="search" type="submit">Search</button>
  <button class="button" id="refresh" type="button">Refresh</button>
  <div class="banner" id="banner"></div>
</form>

<!-- Session lookup bar -->
<div class="query-bar" id="session-bar">
  <label style="font-size:12px;color:var(--muted);white-space:nowrap">Session ID</label>
  <input class="control" id="session-id" type="text" placeholder="Paste a session ID to see all its captures..." autocomplete="off" style="flex:1;min-width:200px">
  <button class="button primary" id="session-search" type="button">Lookup</button>
  <div class="banner" id="session-banner"></div>
</div>

<!-- Main split: results list | detail -->
<div class="main">
  <section class="panel" id="results-panel">
    <div class="head">
      <div><strong>Results</strong><span id="results-sub" style="font-size:11px;color:var(--muted);margin-left:8px;font-weight:normal"></span></div>
      <select class="control" id="results-source" style="padding:5px 8px;font-size:11px;border-radius:8px">
        <option value="search">Search Hits</option>
        <option value="recent">Recent Captures</option>
        <option value="session">Session Captures</option>
      </select>
    </div>
    <div class="body"><div class="list" id="results"></div></div>
  </section>

  <section class="panel" id="detail-panel">
    <div class="head">
      <div><strong>Capture Detail</strong><span id="detail-sub" style="font-size:11px;color:var(--muted);margin-left:8px;font-weight:normal"></span></div>
    </div>
    <div class="body" id="detail"></div>
  </section>
</div>

</div>
<script src="assets/xterm/xterm.min.js"></script>
<script src="assets/xterm/addon-fit.js"></script>
<script type="module">
import { showTranscriptModal, showReplayModal } from './js/modules/session-viewer.js';

const state = {
  status: null, recent: [], results: [], sessionCaptures: [], lastSearch: null,
  selected: null, selectedId: null, queryCount: 0,
  detailLoading: false, listMode: 'search'
};

const el = id => document.getElementById(id);
const nodes = {
  docs: el('docs'), sessions: el('sessions'), queries: el('queries'),
  statusPills: el('status-pills'),
  query: el('query'), mode: el('mode'), topk: el('topk'),
  search: el('search'), refresh: el('refresh'), banner: el('banner'),
  sessionId: el('session-id'), sessionSearch: el('session-search'), sessionBanner: el('session-banner'),
  results: el('results'), resultsSub: el('results-sub'),
  resultsSource: el('results-source'),
  detail: el('detail'), detailSub: el('detail-sub')
};

const esc = v => String(v ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const shortId = v => !v ? 'n/a' : (v.length <= 14 ? v : v.slice(0, 8) + '\u2026' + v.slice(-4));
const fmtDate = v => {
  if (!v) return 'n/a';
  const d = new Date(v);
  if (Number.isNaN(d.getTime())) return 'n/a';
  return new Intl.DateTimeFormat(undefined, {month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(d);
};
const fmtScore = v => typeof v === 'number' ? (v * 100).toFixed(1) + '%' : '';
function scoreClass(v) { return v >= 0.5 ? 'high' : v >= 0.25 ? 'mid' : 'low'; }
function scoreColor(v) { return v >= 0.5 ? 'var(--ok)' : v >= 0.25 ? 'var(--warn)' : 'var(--bad)'; }

const TAB_TOKEN_KEY = 'viberails_tab';
function getTabToken() { try { return sessionStorage.getItem(TAB_TOKEN_KEY) || '' } catch { return '' } }
function buildHeaders(overrides) {
  const headers = new Headers();
  if (overrides) {
    if (overrides instanceof Headers) overrides.forEach((v, k) => headers.set(k, v));
    else for (const [k, v] of Object.entries(overrides)) { if (v != null) headers.set(k, String(v)); }
  }
  if (!headers.has('Content-Type')) headers.set('Content-Type', 'application/json');
  const tab = getTabToken();
  if (tab) headers.set('viberails_tab', tab);
  return headers;
}

function setBanner(msg, tone) {
  nodes.banner.textContent = msg || '';
  nodes.banner.className = 'banner' + (tone ? ' ' + tone : '');
}
function setBusy(flag) { nodes.search.disabled = flag; nodes.refresh.disabled = flag; }

async function fetchJson(url, init) {
  const res = await fetch(url, { credentials: 'include', cache: 'no-store', ...init, headers: buildHeaders(init && init.headers ? init.headers : void 0) });
  const text = await res.text();
  let data = {};
  if (text) { try { data = JSON.parse(text); } catch { data = { message: text }; } }
  if (!res.ok) {
    if (res.status === 404) throw new Error('BERT API routes not loaded. Restart the app from the updated build.');
    throw new Error(data.error || data.message || 'Request failed.');
  }
  return data;
}

// ---- Render: status pills (compact) ----
function renderStatus() {
  const s = state.status;
  if (!s) return;
  nodes.docs.textContent = String(s.documentCount || 0);
  nodes.sessions.textContent = String(s.sessionCount || 0);
  nodes.statusPills.innerHTML =
    `<span class="pill ${s.databaseExists ? 'ok' : 'bad'}" title="Database">${s.databaseExists ? 'DB OK' : 'DB Missing'}</span>` +
    `<span class="pill ${s.semanticSearchAvailable ? 'ok' : 'warn'}" title="Semantic search">${s.semanticSearchAvailable ? 'Semantic Ready' : 'Semantic N/A'}</span>`;
  nodes.mode.querySelector('option[value="semantic"]').disabled = !s.semanticSearchAvailable;
  if (!s.semanticSearchAvailable && nodes.mode.value === 'semantic') nodes.mode.value = 'text';
}

// ---- Render: results list ----
function renderResultsList() {
  const items = state.listMode === 'search' ? state.results : state.listMode === 'session' ? state.sessionCaptures : state.recent;
  const showScore = state.listMode === 'search';

  if (!items || items.length === 0) {
    const msg = state.listMode === 'search'
      ? (state.lastSearch ? `No results for "${state.lastSearch.query}".` : 'Run a search to see results.')
      : state.listMode === 'session'
      ? 'No captures found for this session. Enter a session ID above.'
      : 'No recent captures found.';
    nodes.results.innerHTML = `<div class="empty">${esc(msg)}</div>`;
    if (state.listMode === 'search' && state.lastSearch) {
      nodes.resultsSub.textContent = '0 hits';
    } else {
      nodes.resultsSub.textContent = '';
    }
    return;
  }

  if (state.listMode === 'search' && state.lastSearch) {
    nodes.resultsSub.textContent = `${state.lastSearch.results.length} hit(s) in ${state.lastSearch.searchTimeMs}ms`;
  } else {
    nodes.resultsSub.textContent = `${items.length} capture(s)`;
  }

  nodes.results.innerHTML = items.map(item => {
    const scoreHtml = showScore && typeof item.score === 'number'
      ? `<span class="score-chip ${scoreClass(item.score)}">${fmtScore(item.score)}</span>`
      : '';
    return `<button class="item ${item.documentId === state.selectedId ? 'sel' : ''}" type="button" data-doc-id="${esc(item.documentId)}">
      <div class="item-top">
        <div class="item-chips">
          <span class="chip" style="font-size:10px">${esc(item.cli || '?')}</span>
          <span class="chip" style="font-size:10px">${esc(shortId(item.documentId))}</span>
        </div>
        ${scoreHtml}
      </div>
      <div class="item-text">${esc(item.userTextPreview || '[no text]')}</div>
      <div class="item-bottom">
        <span>${esc(fmtDate(item.timestampUTC))}</span>
        <span>${esc(item.fileChangeCount)} file(s)</span>
      </div>
    </button>`;
  }).join('');
}

// ---- Render: detail ----
function renderDetail() {
  if (!state.selected) {
    nodes.detailSub.textContent = '';
    nodes.detail.innerHTML = '<div class="empty">Click a result to inspect it.</div>';
    return;
  }

  const i = state.selected;
  const hasFullDetail = !!i.rawText;
  nodes.detailSub.textContent = shortId(i.documentId);

  // Score banner
  let scoreBanner = '';
  if (typeof i.score === 'number') {
    const pct = (i.score * 100).toFixed(1);
    const color = scoreColor(i.score);
    scoreBanner = `
      <div class="score-banner">
        <div style="flex:1">
          <div class="score-label">Match Confidence</div>
          <div class="score-bar-track"><div class="score-bar-fill" style="width:${pct}%;background:${color}"></div></div>
        </div>
        <div style="text-align:right">
          <div class="score-value" style="color:${color}">${pct}%</div>
          <div class="score-label">${i.score >= 0.5 ? 'Strong' : i.score >= 0.25 ? 'Moderate' : 'Weak'}</div>
        </div>
      </div>`;
  }

  // Session actions — only when we have a sessionId to query
  const sessionActions = i.sessionId
    ? `<div class="session-actions">
        <button class="button" type="button" data-action="get-transcript" title="View the plain-text transcript for the session this capture came from"><i class="fa-solid fa-file-lines" style="margin-right:6px"></i>Get Transcript</button>
        <button class="button" type="button" data-action="get-session" title="Replay the full terminal recording for the session this capture came from"><i class="fa-solid fa-play" style="margin-right:6px"></i>Get Session</button>
      </div>`
    : '';

  // User text (most important thing to show)
  const userText = i.userText || i.userTextPreview || '';
  const textLabel = i.userText ? 'User Text (full)' : 'User Text (preview)';
  const textSection = userText
    ? `<div class="section"><h3>${textLabel}</h3><pre>${esc(userText)}</pre></div>`
    : '';

  // Metadata grid
  const meta = [
    ['CLI', i.cli || 'Unknown'],
    ['Environment', i.environmentName || 'None'],
    ['Timestamp', fmtDate(i.timestampUTC)],
    ['Sequence', i.sequence ?? 'n/a'],
    ['Session', i.sessionId || 'n/a'],
    ['User Input ID', i.userInputId ?? 'n/a'],
    ['Git Commit', i.gitCommitHash || 'n/a'],
    ['Working Directory', i.workingDirectory || 'n/a'],
    ['File Changes', i.fileChangeCount ?? 0],
  ].map(([label, value]) =>
    `<div class="meta-card"><div class="label">${esc(label)}</div><div class="value">${esc(String(value))}</div></div>`
  ).join('');

  // File changes table
  let fileSection = '';
  if (i.fileChanges && i.fileChanges.length) {
    fileSection = `<div class="section"><h3>File Changes</h3><div class="ftable"><table>
      <thead><tr><th>File</th><th>Type</th><th>+</th><th>-</th></tr></thead>
      <tbody>${i.fileChanges.map(c => `<tr><td><code>${esc(c.filePath)}</code></td><td>${esc(c.changeType)}</td><td style="color:var(--ok)">${c.linesAdded ?? '-'}</td><td style="color:var(--bad)">${c.linesDeleted ?? '-'}</td></tr>`).join('')}</tbody>
    </table></div></div>`;
  } else if (hasFullDetail) {
    fileSection = `<div class="section"><h3>File Changes</h3><div class="empty" style="min-height:60px">No file changes recorded.</div></div>`;
  }

  // Raw payload (collapsed by default)
  const rawSection = hasFullDetail
    ? `<details><summary>Raw capture payload (${i.rawText.length.toLocaleString()} chars)</summary><pre>${esc(i.rawText)}</pre></details>`
    : '';

  const loadingHint = state.detailLoading
    ? '<div style="color:var(--accent);font-size:11px">Loading full detail\u2026</div>'
    : '';

  nodes.detail.innerHTML = `<div class="detail">
    ${scoreBanner}
    ${sessionActions}
    ${textSection}
    <div class="section"><h3>Metadata</h3><div class="meta-grid">${meta}</div></div>
    ${fileSection}
    ${rawSection}
    ${loadingHint}
  </div>`;
}

// ---- Data loading ----
async function loadStatus() { state.status = await fetchJson('/api/v1/bert/status'); renderStatus(); }

async function loadRecent() {
  const p = await fetchJson('/api/v1/bert/captures?take=50');
  state.recent = p.captures || [];
  if (state.listMode === 'recent') renderResultsList();
}

async function loadCapture(id, source) {
  state.selectedId = id;
  // Immediately show the summary data we already have
  const summary = state.results.find(r => r.documentId === id) || state.recent.find(r => r.documentId === id);
  if (summary) { state.selected = summary; state.detailLoading = true; }
  renderResultsList();
  renderDetail();

  // Try to fetch full detail
  try {
    const full = await fetchJson(`/api/v1/bert/captures/${encodeURIComponent(id)}`);
    if (summary && typeof summary.score === 'number') full.score = summary.score;
    state.selected = full;
  } catch (e) {
    if (!summary) setBanner(`Could not load detail: ${e.message}`, 'error');
  } finally {
    state.detailLoading = false;
  }
  renderResultsList();
  renderDetail();
}

async function refreshAll() {
  setBusy(true);
  try {
    await loadStatus();
    await loadRecent();
    if (state.listMode === 'recent' && state.recent.length && !state.selectedId) {
      await loadCapture(state.recent[0].documentId, 'recent');
    }
    setBanner('Refreshed.', 'success');
  } catch (err) { setBanner(err.message, 'error'); }
  finally { setBusy(false); }
}

function setSessionBanner(msg, tone) {
  nodes.sessionBanner.textContent = msg || '';
  nodes.sessionBanner.className = 'banner' + (tone ? ' ' + tone : '');
}

async function runSessionLookup() {
  const sid = nodes.sessionId.value.trim();
  if (!sid) { setSessionBanner('Enter a session ID.', 'error'); nodes.sessionId.focus(); return; }
  setBusy(true);
  nodes.sessionSearch.disabled = true;
  setSessionBanner('');
  state.sessionCaptures = [];
  state.selected = null;
  state.selectedId = null;
  state.listMode = 'session';
  nodes.resultsSource.value = 'session';
  renderResultsList();
  renderDetail();
  try {
    const p = await fetchJson(`/api/v1/bert/captures/by-session/${encodeURIComponent(sid)}`);
    state.sessionCaptures = p.captures || [];
    renderResultsList();
    if (state.sessionCaptures.length) {
      await loadCapture(state.sessionCaptures[0].documentId, 'session');
      setSessionBanner(`${state.sessionCaptures.length} capture(s) found.`, 'success');
    } else {
      setSessionBanner('No captures for this session.', 'error');
    }
  } catch (err) {
    state.sessionCaptures = [];
    renderResultsList();
    setSessionBanner(err.message, 'error');
  } finally { setBusy(false); nodes.sessionSearch.disabled = false; }
}

async function runSearch() {
  const query = nodes.query.value.trim();
  if (!query) { setBanner('Enter a query first.', 'error'); nodes.query.focus(); return; }
  setBusy(true);
  state.results = [];
  state.selected = null;
  state.selectedId = null;
  state.listMode = 'search';
  nodes.resultsSource.value = 'search';
  state.lastSearch = { query, results: [], documentCount: state.status ? state.status.documentCount : 0, searchTimeMs: 0 };
  renderResultsList();
  renderDetail();
  try {
    const p = await fetchJson('/api/v1/bert/search', {
      method: 'POST',
      body: JSON.stringify({ query, mode: nodes.mode.value, topK: Number(nodes.topk.value) || 10 })
    });
    state.lastSearch = p;
    state.results = p.results || [];
    state.queryCount += 1;
    nodes.queries.textContent = String(state.queryCount);
    renderResultsList();
    // Auto-select first result
    if (state.results.length) await loadCapture(state.results[0].documentId, 'search');
    setBanner(`${p.results.length} hit(s) in ${p.searchTimeMs}ms`, 'success');
  } catch (err) {
    state.results = [];
    renderResultsList();
    setBanner(err.message, 'error');
  } finally { setBusy(false); }
}

// ---- Event listeners ----
el('form').addEventListener('submit', e => { e.preventDefault(); runSearch(); });
nodes.sessionSearch.addEventListener('click', runSessionLookup);
nodes.sessionId.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); runSessionLookup(); } });
nodes.refresh.addEventListener('click', refreshAll);
nodes.results.addEventListener('click', e => {
  const b = e.target.closest('[data-doc-id]');
  if (b) loadCapture(b.getAttribute('data-doc-id'), state.listMode);
});
nodes.resultsSource.addEventListener('change', () => {
  state.listMode = nodes.resultsSource.value;
  renderResultsList();
});
nodes.detail.addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const sessionId = state.selected?.sessionId;
  if (!sessionId) { setBanner('No session ID on this capture.', 'error'); return; }
  const action = btn.getAttribute('data-action');
  if (action === 'get-transcript') void showTranscriptModal(sessionId);
  else if (action === 'get-session') void showReplayModal(sessionId);
});

// ---- Init ----
refreshAll();
</script>
</body>
</html>
