name: macOS launch regressions

on:
  pull_request:
    paths:
      - 'VibeRails/Services/Terminal/**'
      - 'VibeRails/Services/LlmClis/**'
      - 'Pty.Net/**'
      - 'Tests/Services/LlmClis/**'
      - 'Tests/Services/Terminal/**'
      - '.github/workflows/macos-launch-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.103'
      - name: Verify real zsh argv, native PTY and Board bootstrap prompts
        run: >-
          dotnet test Tests/Tests.csproj
          --filter 'FullyQualifiedName~MacCliLaunchTests|FullyQualifiedName~CommandServiceTests|FullyQualifiedName~CliSpawnCommandBuilderTests'
