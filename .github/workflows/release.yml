name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PROJECT_PATH: ./VibeRails/VibeRails.csproj
  CONFIGURATION: Release
  FRAMEWORK: net10.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-x64
            os: macos-15-intel
          - rid: osx-arm64
            os: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.103"

      - name: Install Linux NativeAOT dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish NativeAOT (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $outDir = "artifacts/${{ matrix.rid }}"
          dotnet publish "$env:PROJECT_PATH" `
            -c "$env:CONFIGURATION" `
            -f "$env:FRAMEWORK" `
            -r "${{ matrix.rid }}" `
            --self-contained true `
            -o "$outDir" `
            /p:PublishAot=true `
            /p:StripSymbols=true `
            /p:InvariantGlobalization=true

      - name: Publish NativeAOT (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          out_dir="artifacts/${{ matrix.rid }}"
          dotnet publish "$PROJECT_PATH" \
            -c "$CONFIGURATION" \
            -f "$FRAMEWORK" \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -o "$out_dir" \
            /p:PublishAot=true \
            /p:StripSymbols=true \
            /p:InvariantGlobalization=true

      - name: Sign Windows binary
        if: runner.os == 'Windows'
        uses: azure/trusted-signing-action@v0.4.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: viberails
          certificate-profile-name: viberails-signing
          files-folder: artifacts/win-x64
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package + checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rid = "${{ matrix.rid }}"
          $assetDir = "release-assets"
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null

          $archive = Join-Path $assetDir "vb-$rid.zip"
          Compress-Archive -Path "artifacts/$rid/*" -DestinationPath $archive -Force

          $hash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $archive)" | Set-Content -Path "$archive.sha256" -Encoding ascii

      - name: Package + checksum (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          mkdir -p release-assets

          archive="release-assets/vb-${rid}.tar.gz"
          tar -czf "$archive" -C "artifacts/${rid}" .

          hash="$(shasum -a 256 "$archive" | awk '{print tolower($1)}')"
          printf "%s  %s\n" "$hash" "$(basename "$archive")" > "${archive}.sha256"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.rid }}
          path: release-assets/*
          if-no-files-found: error

      - name: Upload publish output for extension packaging
        if: ${{ matrix.rid == 'win-x64' || matrix.rid == 'linux-x64' || matrix.rid == 'osx-x64' || matrix.rid == 'osx-arm64' }}
        uses: actions/upload-artifact@v7
        with:
          name: publish-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/*
          if-no-files-found: error

  package_extension:
    name: Package VSIX ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            rid: win-x64
            os: windows-latest
            binary_name: vb.exe
          - target: linux-x64
            rid: linux-x64
            os: ubuntu-latest
            binary_name: vb
          - target: darwin-x64
            rid: osx-x64
            os: macos-15-intel
            binary_name: vb
          - target: darwin-arm64
            rid: osx-arm64
            os: macos-14
            binary_name: vb

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: vscode-viberails/package-lock.json

      - name: Install extension dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd vscode-viberails
          npm ci

      - name: Download publish output
        uses: actions/download-artifact@v7
        with:
          name: publish-${{ matrix.rid }}
          path: Scripts/artifacts/aot/${{ matrix.rid }}

      - name: Restore executable bit for non-Windows binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "Scripts/artifacts/aot/${{ matrix.rid }}/${{ matrix.binary_name }}"

      - name: Package bundled VSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location "vscode-viberails"
          try {
              ../deploy/package-platforms.ps1 -Targets "${{ matrix.target }}"
          } finally {
              Pop-Location
          }

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: extension-vsix-${{ matrix.target }}
          path: vscode-viberails/dist/vscode-viberails-${{ matrix.target }}-*.vsix
          if-no-files-found: error

  publish_extension:
    name: Publish VS Code Extension
    runs-on: ubuntu-latest
    needs: package_extension
    env:
      VSCE_PAT: ${{ secrets.VS_PAT }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Download VSIX artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: extension-vsix-*
          path: dist
          merge-multiple: true

      - name: Publish VSIX packages
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "VS_PAT GitHub secret is required to publish the VS Code extension." >&2
            exit 1
          fi

          shopt -s nullglob
          packages=(dist/*.vsix)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No VSIX packages found to publish." >&2
            exit 1
          fi

          for package in "${packages[@]}"; do
            npx --yes @vscode/vsce publish --packagePath "$package" --skip-duplicate
          done

  upload:
    name: Upload Assets To GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build
      - package_extension
      - publish_extension
    steps:
      - name: Ensure GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gh
          fi

      - name: Download workflow artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Download VSIX artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: extension-vsix-*
          path: release-assets
          merge-multiple: true

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"

          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$repo" \
              --title "VibeRails ${tag#v}" \
              --draft=false
          else
            gh release create "$tag" \
              --repo "$repo" \
              --title "VibeRails ${tag#v}" \
              --generate-notes
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"
          gh release upload "$tag" release-assets/* --repo "$repo" --clobber
