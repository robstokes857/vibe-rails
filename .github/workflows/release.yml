name: Release

on:
  push:
    tags:
      - "v*"

# Read-only by default. Only the upload job writes (the GitHub release); third-party
# actions are pinned by commit SHA, so a moved tag cannot change what runs here.
permissions:
  contents: read

env:
  PROJECT_PATH: ./VibeRails/VibeRails.csproj
  CONFIGURATION: Release
  FRAMEWORK: net10.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Pin Ubuntu 24.04 before the 2026-10-19 label move; revisit only with a deliberate Linux glibc/toolchain floor change.
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.103"

      - name: Run .NET tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet test VibeRails.slnx \
            -c "$CONFIGURATION" \
            -f "$FRAMEWORK"

      - name: Check shell model installation
        shell: bash
        run: bash Tests/Deployment/bert-model-assets.test.sh

  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    needs: test
    # The Windows leg signs with the AZURE_* credentials. Moved into this environment's
    # secrets (with a reviewer and a v* tag rule), they stay out of every other job.
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-24.04
          - rid: osx-arm64
            # macos-15 (arm64, Xcode 16) ships the Swift static libs the .NET Apple
            # crypto PAL needs for NativeAOT linking; macos-14 does not, so the
            # debug-bundle AesGcm/RSA usage fails to link there (undefined
            # __swift_FORCE_LOAD_$_swift_* from pal_swiftbindings.o).
            os: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.103"

      - name: Install Linux NativeAOT dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish NativeAOT (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $outDir = "artifacts/${{ matrix.rid }}"
          dotnet publish "$env:PROJECT_PATH" `
            -c "$env:CONFIGURATION" `
            -f "$env:FRAMEWORK" `
            -r "${{ matrix.rid }}" `
            --self-contained true `
            -o "$outDir" `
            /p:PublishAot=true `
            /p:StripSymbols=true `
            /p:InvariantGlobalization=true `
            /p:TreatWarningsAsErrors=true `
            /p:ILLinkTreatWarningsAsErrors=true

      - name: Publish NativeAOT (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          out_dir="artifacts/${{ matrix.rid }}"
          dotnet publish "$PROJECT_PATH" \
            -c "$CONFIGURATION" \
            -f "$FRAMEWORK" \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -o "$out_dir" \
            /p:PublishAot=true \
            /p:StripSymbols=true \
            /p:InvariantGlobalization=true \
            /p:TreatWarningsAsErrors=true \
            /p:ILLinkTreatWarningsAsErrors=true

      - name: Bundle app-local Windows VC runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./deploy/prepare-windows-payload.ps1 -PayloadDirectory artifacts/win-x64

      - name: Sign Windows binary
        if: runner.os == 'Windows'
        uses: azure/trusted-signing-action@acc6d03023f35c22bfc9ac05d2981db9dc008330 # v0.4.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: viberails
          certificate-profile-name: viberails-signing
          files-folder: artifacts/win-x64
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # The vb.exe signature covers only vb.exe. A signed catalog of every payload file lets
      # install.ps1 reject a replaced archive that keeps a genuine vb.exe beside altered DLLs,
      # hooks or web assets. Built after signing, so it records the signed vb.exe.
      - name: Catalog Windows payload
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          New-FileCatalog -Path "artifacts/${{ matrix.rid }}" -CatalogFilePath "release-assets/vb-${{ matrix.rid }}.cat" -CatalogVersion 2.0 | Out-Null

      - name: Sign Windows payload catalog
        if: runner.os == 'Windows'
        uses: azure/trusted-signing-action@acc6d03023f35c22bfc9ac05d2981db9dc008330 # v0.4.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: viberails
          certificate-profile-name: viberails-signing
          files-folder: release-assets
          files-folder-filter: cat
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package + checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rid = "${{ matrix.rid }}"
          $assetDir = "release-assets"
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null

          $archive = Join-Path $assetDir "vb-$rid.zip"
          Compress-Archive -Path "artifacts/$rid/*" -DestinationPath $archive -Force

          $hash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $archive)" | Set-Content -Path "$archive.sha256" -Encoding ascii

      - name: Package + checksum (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          mkdir -p release-assets

          archive="release-assets/vb-${rid}.tar.gz"
          tar -czf "$archive" -C "artifacts/${rid}" .

          hash="$(shasum -a 256 "$archive" | awk '{print tolower($1)}')"
          printf "%s  %s\n" "$hash" "$(basename "$archive")" > "${archive}.sha256"

      - name: Verify NativeAOT release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rid = "${{ matrix.rid }}"
          $archive = "release-assets/vb-$rid.zip"
          $verifyDir = Join-Path $env:RUNNER_TEMP "viberails-archive-$rid-$([Guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Path $verifyDir | Out-Null

          try {
              Expand-Archive -LiteralPath $archive -DestinationPath $verifyDir

              $requiredFiles = @(
                  "vb.exe",
                  "appsettings.json",
                  "wwwroot/index.html",
                  "Models/BertV2/model.onnx.gz",
                  "Models/BertV2/vocab.txt",
                  "scripts/pre-commit-hook.sh",
                  "scripts/commit-msg-hook.sh",
                  "onnxruntime.dll",
                  "e_sqlite3.dll",
                  "vec0.dll"
              )
              foreach ($relativePath in $requiredFiles) {
                  $path = Join-Path $verifyDir $relativePath
                  if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                      throw "Release archive $archive is missing required file: $relativePath"
                  }
              }

              # VBD is statically folded into the NativeAOT vb executable. A
              # separate daemon DLL would be both unnecessary and easy to omit
              # from one of the installer paths, so fail if one appears.
              $daemonDll = Get-ChildItem -LiteralPath $verifyDir -Recurse -File -Filter "VibeRails.Daemon.dll" |
                  Select-Object -First 1
              if ($daemonDll) {
                  throw "Unexpected separate VBD assembly in release archive: $($daemonDll.FullName)"
              }

              # Run install.ps1's own checks on what users will download, so a signing
              # identity change or an archive/catalog mismatch fails the release, not installs.
              $parseErrors = $null
              $installer = [System.Management.Automation.Language.Parser]::ParseFile(
                  (Resolve-Path "Scripts/install.ps1").Path, [ref]$null, [ref]$parseErrors)
              if ($parseErrors.Count -gt 0) { throw ($parseErrors -join [Environment]::NewLine) }
              foreach ($functionName in @('Assert-PublisherSignature', 'Assert-PayloadMatchesCatalog')) {
                  $function = $installer.Find({ param($node)
                      $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                          $node.Name -eq $functionName
                  }, $false)
                  if ($null -eq $function) { throw "Scripts/install.ps1 has no $functionName function." }
                  . ([scriptblock]::Create($function.Extent.Text))
              }
              $catalog = "release-assets/vb-$rid.cat"
              Assert-PublisherSignature -Path $catalog
              Assert-PayloadMatchesCatalog -PayloadDir $verifyDir -CatalogPath $catalog
              Assert-PublisherSignature -Path (Join-Path $verifyDir "vb.exe")
          } finally {
              $runnerTemp = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP)
              $separator = [string][System.IO.Path]::DirectorySeparatorChar
              if (-not $runnerTemp.EndsWith($separator, [StringComparison]::Ordinal)) {
                  $runnerTemp += $separator
              }
              $resolvedVerifyDir = [System.IO.Path]::GetFullPath($verifyDir)
              if (-not $resolvedVerifyDir.StartsWith($runnerTemp, [StringComparison]::OrdinalIgnoreCase)) {
                  throw "Refusing to clean archive verification directory outside RUNNER_TEMP: $resolvedVerifyDir"
              }
              Remove-Item -LiteralPath $resolvedVerifyDir -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Verify NativeAOT release archive (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          archive="release-assets/vb-${rid}.tar.gz"
          verify_dir="$(mktemp -d)"
          smoke_publish="$(mktemp -d)"
          smoke_cwd="$(mktemp -d)"
          cleanup() {
            rm -rf -- "$verify_dir" "$smoke_publish" "$smoke_cwd"
          }
          trap cleanup EXIT

          tar -xzf "$archive" -C "$verify_dir"

          required_files=(
            "vb"
            "appsettings.json"
            "wwwroot/index.html"
            "Models/BertV2/model.onnx.gz"
            "Models/BertV2/vocab.txt"
            "scripts/pre-commit-hook.sh"
            "scripts/commit-msg-hook.sh"
          )

          case "$rid" in
            linux-x64)
              required_files+=("libonnxruntime.so" "libe_sqlite3.so" "vec0.so")
              expected_format='ELF 64-bit'
              ;;
            osx-arm64)
              required_files+=("libonnxruntime.dylib" "libe_sqlite3.dylib" "vec0.dylib")
              expected_format='Mach-O 64-bit'
              ;;
            *)
              echo "Unsupported release verification RID: $rid" >&2
              exit 1
              ;;
          esac

          for relative_path in "${required_files[@]}"; do
            if [ ! -f "$verify_dir/$relative_path" ]; then
              echo "Release archive $archive is missing required file: $relative_path" >&2
              exit 1
            fi
          done

          if find "$verify_dir" -type f -name 'VibeRails.Daemon.dll' -print -quit | grep -q .; then
            echo "Unexpected separate VBD assembly in release archive." >&2
            exit 1
          fi

          chmod +x "$verify_dir/vb"
          if ! file "$verify_dir/vb" | grep -q "$expected_format"; then
            echo "Packaged vb is not the expected NativeAOT executable format: $expected_format" >&2
            file "$verify_dir/vb" >&2
            exit 1
          fi

          if [ "$rid" = 'linux-x64' ]; then
            # Measured from v10.11.19; raise only with a deliberate Linux compatibility floor change.
            max_glibc='GLIBC_2.34'
            for binary in vb libonnxruntime.so libe_sqlite3.so vec0.so; do
              required_glibc="$(objdump -T "$verify_dir/$binary" |
                awk 'match($0, /GLIBC_[0-9]+(\.[0-9]+)+/) { print substr($0, RSTART, RLENGTH) }' |
                sort -Vu | tail -n 1)"
              if [ -z "$required_glibc" ]; then
                echo "Could not determine the glibc requirement of $binary." >&2
                exit 1
              fi
              echo "$binary requires $required_glibc (release ceiling: $max_glibc)"
              highest_glibc="$(printf '%s\n' "$max_glibc" "$required_glibc" | sort -V | tail -n 1)"
              if [ "$highest_glibc" != "$max_glibc" ]; then
                echo "$binary requires $required_glibc, exceeding the deliberate release ceiling $max_glibc." >&2
                exit 1
              fi
            done
          fi

          # Compile the actual storage/loader path as NativeAOT, then use only the
          # native libraries extracted from the release. Running outside that
          # directory catches bare-name dlopen failures that file checks miss.
          dotnet publish tools/sqlite-vec-smoke/SqliteVecSmoke.csproj \
            -c "$CONFIGURATION" -f "$FRAMEWORK" -r "$rid" \
            --self-contained true -o "$smoke_publish" \
            /p:TreatWarningsAsErrors=true /p:ILLinkTreatWarningsAsErrors=true
          cp "$smoke_publish/sqlite-vec-smoke" "$verify_dir/sqlite-vec-smoke"
          (
            cd "$smoke_cwd"
            "$verify_dir/sqlite-vec-smoke"
          )

      - name: Install pinned Inno Setup compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $download
          $expected = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          if ((Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
              throw 'Inno Setup compiler checksum mismatch.'
          }
          if ((Get-AuthenticodeSignature -LiteralPath $download).Status -ne 'Valid') {
              throw 'Inno Setup compiler signature is invalid.'
          }
          $compilerDir = Join-Path $env:RUNNER_TEMP 'inno'
          $process = Start-Process -FilePath $download -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/NOICONS', ('/DIR="' + $compilerDir + '"')) -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Inno installation failed: $($process.ExitCode)" }
          "INNO_COMPILER=$compilerDir\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test Windows installer lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./deploy/installer/test.ps1 -PayloadDirectory artifacts/win-x64 -Compiler $env:INNO_COMPILER

      - name: Upload Windows installer test logs
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-test-logs
          path: .test-artifacts/installer-test/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build signed Windows installer and checksum
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          ./deploy/build-installer.ps1 -PayloadDirectory artifacts/win-x64 -Version $version -OutputDirectory release-assets -Compiler $env:INNO_COMPILER -ReleaseSigning

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ matrix.rid }}
          path: release-assets/*
          if-no-files-found: error

      - name: Upload publish output for extension packaging
        if: ${{ matrix.rid == 'win-x64' || matrix.rid == 'linux-x64' || matrix.rid == 'osx-arm64' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/*
          if-no-files-found: error

  package_extension:
    name: Package VSIX ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            rid: win-x64
            os: windows-latest
            binary_name: vb.exe
          - target: linux-x64
            rid: linux-x64
            os: ubuntu-24.04
            binary_name: vb
          - target: darwin-arm64
            rid: osx-arm64
            # Match the native build runner; macOS 14 retires on 2026-11-02.
            os: macos-15
            binary_name: vb

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: vscode-viberails/package-lock.json

      - name: Install extension dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd vscode-viberails
          npm ci

      - name: Download publish output
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: publish-${{ matrix.rid }}
          path: Scripts/artifacts/aot/${{ matrix.rid }}

      - name: Restore executable bit for non-Windows binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "Scripts/artifacts/aot/${{ matrix.rid }}/${{ matrix.binary_name }}"

      - name: Package bundled VSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location "vscode-viberails"
          try {
              ../deploy/package-platforms.ps1 -Targets "${{ matrix.target }}"
          } finally {
              Pop-Location
          }

      # "<hash>  <name>" with an LF on every runner, so `sha256sum -c` accepts it.
      # publish_extension globs *.vsix, so these ride along to the release unpublished.
      - name: Checksum VSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packages = @(Get-ChildItem -Path "vscode-viberails/dist" -Filter "vscode-viberails-${{ matrix.target }}-*.vsix" -File)
          if ($packages.Count -eq 0) { throw "No VSIX package was produced for ${{ matrix.target }}." }
          foreach ($package in $packages) {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $package.FullName).Hash.ToLowerInvariant()
              [System.IO.File]::WriteAllText("$($package.FullName).sha256", "$hash  $($package.Name)`n", [System.Text.Encoding]::ASCII)
          }

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-vsix-${{ matrix.target }}
          path: |
            vscode-viberails/dist/vscode-viberails-${{ matrix.target }}-*.vsix
            vscode-viberails/dist/vscode-viberails-${{ matrix.target }}-*.vsix.sha256
          if-no-files-found: error

  publish_extension:
    name: Publish VS Code Extension
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: package_extension
    # Marketplace publishing is its own environment so VS_PAT can be scoped (and gated by a
    # reviewer) separately from the signing credentials.
    environment: vscode-marketplace
    # VSCE_PAT is deliberately NOT job-wide: only the publish step below sees the Marketplace
    # token, so dependency installation (and its install scripts) runs without it in scope.
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ".nvmrc"

      # Installs the lockfile-pinned @vscode/vsce (exact version + integrity hashes for its whole
      # dependency tree) instead of letting npx fetch whatever the registry currently serves.
      - name: Install pinned publishing toolchain
        shell: bash
        run: |
          set -euo pipefail
          cd vscode-viberails
          npm ci

      - name: Download VSIX artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: extension-vsix-*
          path: dist
          merge-multiple: true

      - name: Publish VSIX packages
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VS_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "VS_PAT GitHub secret is required to publish the VS Code extension." >&2
            exit 1
          fi

          vsce="$(pwd)/vscode-viberails/node_modules/.bin/vsce"
          if [ ! -x "$vsce" ]; then
            echo "Pinned @vscode/vsce was not installed; refusing to fall back to an unpinned copy." >&2
            exit 1
          fi

          shopt -s nullglob
          packages=(dist/*.vsix)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No VSIX packages found to publish." >&2
            exit 1
          fi

          # Publish the most-used platform first. Any package that cannot reach the
          # Marketplace aborts this step, so whichever target sorts first in the glob is
          # the only one guaranteed a turn: v1.10.8 spent both of its attempts retrying
          # darwin-arm64 ("Request timeout: /_apis/gallery", a fixed 180s ceiling) and
          # never reached linux-x64 or win32-x64. --skip-duplicate below keeps retries
          # idempotent, so a re-run only has to clear the targets still missing.
          publish_order=(win32-x64 linux-x64 darwin-arm64)
          ordered=()
          remaining=("${packages[@]}")
          for target in "${publish_order[@]}"; do
            unmatched=()
            for package in "${remaining[@]}"; do
              if [[ "$(basename "$package")" == *"-${target}-"* ]]; then
                ordered+=("$package")
              else
                unmatched+=("$package")
              fi
            done
            remaining=("${unmatched[@]}")
          done

          # A target missing from publish_order still publishes, just last, so adding a
          # platform to the build matrix can never silently skip publishing it.
          ordered+=("${remaining[@]}")

          publish_with_retry() {
            local package="$1"
            local max_attempts=5
            local retry_delay_seconds=15
            local attempt

            for ((attempt = 1; attempt <= max_attempts; attempt++)); do
              echo "Publishing $(basename "$package") (attempt ${attempt}/${max_attempts})..."
              if "$vsce" publish --packagePath "$package" --skip-duplicate; then
                return 0
              fi

              if (( attempt == max_attempts )); then
                echo "Publishing $(basename "$package") failed after ${max_attempts} attempts." >&2
                return 1
              fi

              echo "::warning::Marketplace publish failed for $(basename "$package"); retrying in ${retry_delay_seconds} seconds."
              sleep "$retry_delay_seconds"
              retry_delay_seconds=$((retry_delay_seconds * 2))
            done
          }

          for package in "${ordered[@]}"; do
            publish_with_retry "$package"
          done

  upload:
    name: Upload Assets To GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - build
      - package_extension
      - publish_extension
    # The only job that writes: it creates the release and uploads its assets.
    permissions:
      contents: write
    steps:
      # First: checkout cleans the workspace, which would remove downloaded artifacts.
      - name: Checkout installer scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: Scripts
          persist-credentials: false

      - name: Ensure GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gh
          fi

      - name: Download workflow artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Download VSIX artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: extension-vsix-*
          path: release-assets
          merge-multiple: true

      # A tag-pinned installer: releases/download/<tag>/install.ps1 installs exactly that
      # release, and releases/latest/download/install.ps1 replaces the mutable main URL.
      # The copies on main keep an empty tag and install the latest release.
      - name: Stamp tag-pinned installers
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9A-Za-z.+-]+$ ]]; then
            echo "Refusing to stamp installers with unexpected tag: $tag" >&2
            exit 1
          fi
          sed 's/^\$ReleaseTag = ""$/$ReleaseTag = "'"$tag"'"/' Scripts/install.ps1 > release-assets/install.ps1
          sed 's/^RELEASE_TAG=""$/RELEASE_TAG="'"$tag"'"/' Scripts/install.sh > release-assets/install.sh
          grep -qxF "\$ReleaseTag = \"$tag\"" release-assets/install.ps1 || {
            echo "install.ps1 has no empty \$ReleaseTag line to stamp." >&2
            exit 1
          }
          grep -qxF "RELEASE_TAG=\"$tag\"" release-assets/install.sh || {
            echo "install.sh has no empty RELEASE_TAG line to stamp." >&2
            exit 1
          }

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"

          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$repo" \
              --title "VibeRails ${tag#v}" \
              --draft=false
          else
            gh release create "$tag" \
              --repo "$repo" \
              --title "VibeRails ${tag#v}" \
              --generate-notes
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"
          gh release upload "$tag" release-assets/* --repo "$repo" --clobber
